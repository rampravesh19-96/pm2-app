name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5

      - name: Install Dependencies
        run: npm ci
      
      - name: Run Tests
        run: npm test || echo "No Test Defined"